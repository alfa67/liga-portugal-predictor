name: Previsões Automáticas da Liga Portugal

on:
  schedule:
    # Executa automaticamente todas as Segundas e Sextas às 09:00 UTC
    - cron: '0 9 * * 1,5'
  # Permite executar manualmente com 1 clique no GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Instalar Dependências
        run: |
          pip install -r requirements.txt

      - name: 🚀 Executar Modelo Preditivo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python predictor.py

      - name: 💾 Guardar e Fazer Commit das Novas Previsões
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PREDICTIONS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Automático] Atualização das previsões da Liga Portugal" && git push)
